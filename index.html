<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PeTodo</title>
    <meta name="description" content="Aufgaben und ein Begleiter, der davon lebt. Offline, ohne Konto." />
    <meta name="theme-color" content="#edebe4" />
    <meta name="color-scheme" content="light dark" />

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />

    <!--
      Kein Inline-Skript, nirgends: Die Sicherheitsrichtlinie erlaubt ausschließlich
      `script-src 'self'`. Dieses hier läuft vor dem ersten Strich, damit die helle
      Fassung nicht kurz aufblitzt.
    -->
    <script src="src/ui/fassung.js"></script>

    <link rel="stylesheet" href="src/styles/tokens.css" />
    <link rel="stylesheet" href="src/styles/base.css" />
    <link rel="stylesheet" href="src/styles/components.css" />
    <link rel="stylesheet" href="src/styles/layout.css" />
    <link rel="stylesheet" href="src/styles/orb.css" />
    <link rel="stylesheet" href="src/styles/views.css" />
  </head>

  <body>
    <a class="nur-vorlesen" href="#inhalt">Zum Inhalt springen</a>
    <div id="wurzel"></div>

    <noscript>
      <p class="ohne-javascript">
        PeTodo rechnet alles im Browser — ohne JavaScript gibt es nichts anzuzeigen.
      </p>
    </noscript>

    <script type="module" src="src/ui/start.js"></script>
  </body>
</html>
