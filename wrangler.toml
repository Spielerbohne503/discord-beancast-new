# Cloudflare.
#
# Ausgeliefert wird `dist/` — nicht das Wurzelverzeichnis. Cloudflare lädt alles hoch, was
# im angegebenen Verzeichnis liegt; zeigte es auf die Wurzel, stünde `.git` mit der ganzen
# Projektgeschichte im Netz. `.assetsignore` hilft an dieser Stelle nicht, es greift bei
# `directory = "."` nicht.
#
# `[build]` legt die Webseite vorher dorthin. Übersetzt wird dabei nichts — es wird
# kopiert; `index.html` im Wurzelverzeichnis bleibt unverändert lauffähig.
#
# Kein `main`: Es gibt kein Programm auf der Gegenseite, nur Dateien.
#
# **`name` muss zu dem Worker passen, der im Dashboard steht.** Heißt er dort anders,
# gehört hier derselbe Name hin — sonst legt der Deploy einen zweiten daneben.

name = "petodo"
compatibility_date = "2026-08-20"

[build]
command = "node tools/publish.mjs"

[assets]
directory = "dist"

# `not_found_handling` bleibt aus: Die App führt ihren Verlauf im Hash (`#/heute`), es gibt
# also nie einen Pfad, der ins Leere zeigt. Stünde hier „single-page-application“, käme
# statt einer fehlenden `.js`-Datei stillschweigend HTML zurück — und der Fehler läse sich
# dann wie ein Syntaxfehler im Modul.
