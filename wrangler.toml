# Cloudflare.
#
# **Reihenfolge ist hier keine Geschmacksfrage.** In TOML gehört alles, was nach einer
# Tabellenüberschrift steht, zu dieser Tabelle. `main` unter `[build]` wird zu
# `build.main` und ist damit weg. Alle einfachen Angaben stehen deshalb oben.
#
# **`name` muss zu dem Worker passen, der im Dashboard steht.** Heißt er dort anders,
# gehört hier derselbe Name hin — sonst legt der Deploy einen zweiten daneben.

name = "petodo"
compatibility_date = "2026-08-20"

# Der Abgleich zwischen Geräten.
#
# `worker/index.js` beantwortet ausschließlich `/sync/…`; alles andere holt Cloudflare aus
# `dist/`. Damit liegt der Abgleich am **selben Ursprung** wie die App — die
# Sicherheitsrichtlinie braucht keine Ausnahme, und CORS gibt es gar nicht erst.
#
# Der Einstieg ist `entry.js` und nicht `index.js`: Nur `entry.js` zieht
# `cloudflare:workers` herein. `index.js` bleibt dadurch mit `node --test` prüfbar.
main = "worker/entry.js"

# Ausgeliefert wird `dist/` — nicht das Wurzelverzeichnis. Cloudflare lädt alles hoch, was
# im angegebenen Verzeichnis liegt; zeigte es auf die Wurzel, stünde `.git` mit der ganzen
# Projektgeschichte im Netz. `.assetsignore` hilft dort nicht, es greift bei
# `directory = "."` nicht.
#
# `[build]` legt die Webseite vorher dorthin. Übersetzt wird dabei nichts — es wird
# kopiert; `index.html` im Wurzelverzeichnis bleibt unverändert lauffähig.
[build]
command = "node tools/publish.mjs"

[assets]
directory = "dist"
binding = "ASSETS"

# **Ohne diese Zeile gewinnt die Datei.** `dist/offen` liegt dort als Rückfallantwort für
# alles, was kein Worker ist (ein Ordner hinter nginx, GitHub Pages) — ohne sie gäbe es
# dort bei jedem Laden einen 404 im Protokoll. Cloudflare liefert eine vorhandene Datei
# aber **vor** dem Worker aus, und dann sagte auch eine offene Seite „zu“.
#
# Das ist kein Gedankengang, sondern gemessen: `tools/offentest.mjs` hat genau das
# aufgedeckt, nachdem eine erste Messung das Gegenteil zu zeigen schien — die Datei war
# damals erst nach dem Start des Servers entstanden und stand noch in keinem Verzeichnis.
run_worker_first = ["/offen"]

# `not_found_handling` bleibt aus: Die App führt ihren Verlauf im Hash (`#/heute`), es gibt
# also nie einen Pfad, der ins Leere zeigt. Stünde hier „single-page-application“, käme
# statt einer fehlenden `.js`-Datei stillschweigend HTML zurück — und der Fehler läse sich
# dann wie ein Syntaxfehler im Modul.

# ------------------------------------------------------------------------- Abgleich
#
# Ein Durable Object je Raum, mit SQLite als Speicher.
#
# **Hier ist nichts einzutragen und nichts zu entkommentieren.** Das Objekt entsteht beim
# Ausrollen von selbst; es gibt keine Kennung, die jemand aus dem Dashboard abschreiben
# müsste. Genau daran ist die vorherige Fassung mit KV gescheitert: Wer den Schritt nicht
# kannte, hatte einen Abgleich, der nie lief — und nichts sagte das.
#
# Der zweite Grund steht in `worker/raum.js`: Ein Objekt arbeitet einen Aufruf nach dem
# anderen ab. Damit ist die Prüfung „gehst du vom aktuellen Stand aus?“ tatsächlich ein
# Schritt. In KV war sie es nie.

[[durable_objects.bindings]]
name = "RAUM"
class_name = "Raum"

# `new_sqlite_classes` statt `new_classes`: SQLite-gestützte Objekte sind die, die es auch
# im kostenlosen Tarif gibt.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Raum"]

# ---------------------------------------------------------------- Schnittstelle für die KI
#
# Ein Worker steht nirgends, wo jemand wohnt — seine Ortszeit ist UTC. Ohne diese Angabe
# legte `POST /api/aufgaben` mit „18:30“ den Termin im Sommer zwei Stunden daneben.
#
# Das ist die **einzige** Angabe, die die Schnittstelle braucht. Einen Zugangsschlüssel gibt
# es nicht: Der ist das Geheimnis aus dem Koppel-Link. Siehe `docs/KI.md`.

[vars]
ZEITZONE = "Europe/Berlin"
